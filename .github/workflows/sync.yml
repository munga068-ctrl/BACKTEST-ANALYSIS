name: Sync Backtesting Data

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BACKTESTING_DB_ID: ${{ secrets.BACKTESTING_DB_ID }}
        run: python scripts/sync_notion.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if [ -f data/debug.log ]; then
            git add data/debug.log
          elif git ls-files --error-unmatch data/debug.log > /dev/null 2>&1; then
            git rm --cached data/debug.log
          fi
          git diff --staged --quiet || git commit -m "Sync backtest data [skip ci]"
          git push
